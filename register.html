{% extends 'base.html' %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <h2 class="text-primary fw-bold">สมัครสมาชิก</h2>
                </div>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">ชื่อ - นามสกุล</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">อีเมล</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">รหัสผ่าน</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">ประเภทผู้ใช้งาน</label>
                        <select class="form-select" name="role">
                            <option value="student">นักเรียน</option>
                            <option value="teacher">ครูผู้สอน</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 rounded-3">ลงทะเบียน</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
